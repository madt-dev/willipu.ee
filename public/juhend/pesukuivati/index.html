<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2d4a3e" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Pesukuivati kasutusjuhend · Willipu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f2ea;
      color: #22322b;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #2d4a3e;
      color: #fff;
      padding: 20px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header svg { flex: none; }
    header .name {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    header .sub { font-size: 12px; opacity: 0.75; margin-top: 1px; }
    .langs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 20px 0;
      max-width: 640px;
      margin: 0 auto;
    }
    .langs button {
      font: 600 13px 'Inter', sans-serif;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid #2d4a3e33;
      background: #fff;
      color: #2d4a3e;
      cursor: pointer;
    }
    .langs button.active { background: #2d4a3e; color: #fff; border-color: #2d4a3e; }
    main { max-width: 640px; margin: 0 auto; padding: 20px 20px 48px; }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #22322b;
      margin: 10px 0 4px;
    }
    .intro { color: #5a6b62; font-size: 15px; margin-bottom: 22px; }
    ol.steps { list-style: none; counter-reset: step; display: grid; gap: 12px; }
    ol.steps li {
      counter-increment: step;
      background: #fff;
      border-radius: 14px;
      padding: 16px 18px 16px 60px;
      position: relative;
      font-size: 15.5px;
      line-height: 1.55;
      box-shadow: 0 1px 3px rgba(34, 50, 43, 0.07);
    }
    ol.steps li::before {
      content: counter(step);
      position: absolute;
      left: 16px;
      top: 14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #2d4a3e;
      color: #fff;
      font: 700 15px 'Fraunces', serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h2 {
      font-family: 'Fraunces', serif;
      font-size: 19px;
      margin: 28px 0 10px;
    }
    ul.tips { list-style: none; display: grid; gap: 8px; }
    ul.tips li {
      background: #e9efe9;
      border-radius: 12px;
      padding: 12px 16px 12px 40px;
      font-size: 14.5px;
      line-height: 1.5;
      position: relative;
    }
    ul.tips li::before { content: '✓'; position: absolute; left: 16px; color: #2d4a3e; font-weight: 700; }
    .notice {
      margin-top: 24px;
      background: #fbf0dd;
      border: 1px solid #e8d5ae;
      border-radius: 12px;
      padding: 14px 16px 14px 46px;
      font-size: 14.5px;
      line-height: 1.5;
      position: relative;
    }
    .notice + .notice { margin-top: 10px; }
    .notice::before {
      content: '!';
      position: absolute;
      left: 14px;
      top: 13px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #c9932e;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .manual-link {
      display: block;
      margin-top: 20px;
      background: #fff;
      border: 1.5px solid #2d4a3e;
      border-radius: 12px;
      padding: 14px 16px;
      color: #2d4a3e;
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      text-align: center;
    }
    .contact {
      margin-top: 20px;
      background: #2d4a3e;
      color: #fff;
      border-radius: 14px;
      padding: 18px;
      font-size: 15px;
      line-height: 1.5;
    }
    .contact a { color: #ffd98e; font-weight: 600; text-decoration: none; }
    .disclaimer {
      margin-top: 16px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #8b978f;
    }
    footer {
      text-align: center;
      font-size: 12.5px;
      color: #8b978f;
      padding: 0 20px 32px;
    }
    footer a { color: #2d4a3e; }
  </style>
</head>

  const PHONE = '+372 56 955 758';
  const LANGS = Object.keys(T);

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render(lang) {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + ' · Willipu';
    document.getElementById('content').innerHTML =
      '<h1>' + esc(t.title) + '</h1>' +
      '<p class="intro">' + esc(t.intro) + '</p>' +
      '<ol class="steps">' + t.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
      '<h2>' + esc(t.tipsTitle) + '</h2>' +
      '<ul class="tips">' + t.tips.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' +
      t.notices.map(s => '<div class="notice">' + esc(s) + '</div>').join('') +
      '<a class="manual-link" href="' + MANUAL_URL + '" target="_blank" rel="noopener">' + esc(t.manualLabel) + ' ↗</a>' +
      '<div class="contact">' + esc(t.contact) + ': <a href="tel:+37256955758">' + PHONE + '</a></div>' +
      '<p class="disclaimer">' + esc(t.disclaimer) + '</p>';
    document.querySelectorAll('.langs button').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === lang));
    try { localStorage.setItem('willipu_lang', lang); } catch (e) {}
  }

  const nav = document.getElementById('langs');
  LANGS.forEach(code => {
    const b = document.createElement('button');
    b.dataset.lang = code;
    b.textContent = code.toUpperCase();
    b.onclick = () => render(code);
    nav.appendChild(b);
  });

  let initial = 'et';
  try {
    const saved = localStorage.getItem('willipu_lang');
    if (LANGS.includes(saved)) initial = saved;
    else {
      const nav2 = (navigator.languages || [navigator.language || '']).map(l => l.slice(0, 2).toLowerCase());
      initial = nav2.find(l => LANGS.includes(l)) || 'et';
    }
  } catch (e) {}
  render(initial);
  </script>
</body>
</html>
