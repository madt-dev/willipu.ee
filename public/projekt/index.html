  // Official EU emblem: 3:2 flag, 12 stars on a circle of radius h/3,
  // star radius h/18, Reflex Blue + Yellow.
  function euFlag() {
    let stars = '';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      const cx = 150 + 200 / 3 * Math.sin(a), cy = 100 - 200 / 3 * Math.cos(a);
      const R = 200 / 18, r = R * 0.381966, pts = [];
      for (let k = 0; k < 10; k++) {
        const rad = k % 2 ? r : R, b = k * Math.PI / 5;
        pts.push((cx + rad * Math.sin(b)).toFixed(2) + ',' + (cy - rad * Math.cos(b)).toFixed(2));
      }
      stars += '<polygon points="' + pts.join(' ') + '" fill="#FFCC00"/>';
    }
    return '<svg viewBox="0 0 300 200" role="img" aria-label="EU"><rect width="300" height="200" fill="#003399"/>' + stars + '</svg>';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render(lang) {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title + ' · Willipu';
    document.getElementById('content').innerHTML =
      '<a class="back" href="/">' + esc(t.back) + '</a>' +
      '<a href="https://whitecaravan.com" target="_blank" rel="noopener"><img class="wc-logo" src="/whitecaravan-logo.png" alt="WhiteCaravan" width="640" height="68" /></a>' +
      '<div class="kicker">' + esc(t.kicker) + '</div>' +
      '<h1>' + esc(t.title) + '</h1>' +
      t.sections.map(([h, ps]) =>
        '<section><h2>' + esc(h) + '</h2>' + ps.map(p => '<p>' + esc(p) + '</p>').join('') + '</section>'
      ).join('') +
      '<div class="eu">' + euFlag() + '<span>' + esc(t.eu) + '</span></div>';
    document.querySelectorAll('.langs button').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === lang));
    try { localStorage.setItem('willipu_lang', lang); } catch (e) {}
  }

  const nav = document.getElementById('langs');
  LANGS.forEach(code => {
    const b = document.createElement('button');
    b.dataset.lang = code;
    b.textContent = code.toUpperCase();
    b.onclick = () => render(code);
    nav.appendChild(b);
  });

  let initial = 'et';
  try {
    const saved = localStorage.getItem('willipu_lang');
    if (LANGS.includes(saved)) initial = saved;
    else {
      const nav2 = (navigator.languages || [navigator.language || '']).map(l => l.slice(0, 2).toLowerCase());
      initial = nav2.find(l => LANGS.includes(l)) || 'et';
    }
  } catch (e) {}
  render(initial);
  </script>
